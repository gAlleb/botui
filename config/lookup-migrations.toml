# One-time conversion recipes for pre-generic profiles. Not a runtime provider registry.
# Remove after legacy configuration migration support is retired.
[free-dictionary]
endpoint = "https://api.dictionaryapi.dev/api/v2/entries/en"
endpoint_suffix = "/{text}"
response_path = "/*/meanings/*/definitions/*/definition"
response_separator = "\n"
[google-web]
endpoint = "https://translate.googleapis.com/translate_a/single"
query = { client = "gtx", sl = "{source}", tl = "{target}", dt = "t", q = "{text}" }
response_path = "/0/*/0"
response_separator = ""
[google-cloud]
endpoint = "https://translation.googleapis.com/language/translate/v2"
method = "POST"
headers = { X-Goog-Api-Key = "{key}" }
body = '{"q":"{text}","target":"{target}","source":"{source?}","format":"text"}'
response_path = "/data/translations/*/translatedText"
response_separator = "\n"
[deepl]
endpoint = "https://api-free.deepl.com/v2/translate"
method = "POST"
headers = { Authorization = "DeepL-Auth-Key {key}" }
body = '{"text":["{text}"],"target_lang":"{target:upper}","source_lang":"{source:upper?}"}'
response_path = "/translations/*/text"
response_separator = "\n"
[libre-translate]
endpoint = "http://localhost:5000/translate"
method = "POST"
body = '{"q":"{text}","source":"{source}","target":"{target}","format":"text","api_key":"{key}"}'
response_path = "/translatedText"
