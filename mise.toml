[tools]
rust = "1.99.1"
# Cross-compilation tools for the Linux distribution binaries.
zig = "0.15.2"
"github:rust-cross/cargo-zigbuild" = "0.23.4"
cmake = "3.31.10"

[tasks.build]
description = "Build the release executable in target/release"
run = "cargo build --release --locked -p botui"

[tasks.dist]
description = "Build static Linux x86_64 and aarch64 executables and their SHA-256 checksums"
run = """
set -eu
rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
cargo zigbuild --locked --release -p botui --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl
mkdir -p dist
for arch in x86_64 aarch64; do
  install -m 755 "target/${arch}-unknown-linux-musl/release/botui" "dist/botui-${arch}"
done
cd dist
sha256sum botui-x86_64 botui-aarch64 > SHA256SUMS
sha256sum -c SHA256SUMS
"""

[tasks.install]
description = "Install the host executable in ./dist (or PREFIX/bin if set)"
depends = ["build"]
run = """
set -eu
dest=./dist
if [ -n "${PREFIX:-}" ]; then
  dest="$PREFIX/bin"
fi
mkdir -p "$dest"
if ! test target/release/botui -ef "$dest/botui"; then
  install -m 755 target/release/botui "$dest/botui"
fi
echo "Installed $dest/botui"
"""

[tasks.check]
description = "Check formatting, lint all targets and run Rust tests"
run = """
set -eu
cargo fmt --all --check
cargo clippy --workspace --all-targets --locked -- -D warnings
cargo test --workspace --locked -- --include-ignored
"""

[tasks.smoke]
description = "Exercise library, authentication and reader flows in isolated terminals"
run = """
set -eu
cargo build --workspace --locked
for part in config reader reader-navigation annotations text-menu pdf-text space-lookup lookup-settings lookup-migration text-search library shelf sources progress offline resources preferences details bookorbit-bookmarks scroll splitters local-navigation local-startup scan-controls scan-theme scan-zoom palette-events about typography outline native-scroll svg; do
  python3 "scripts/smoke-$part.py"
done
"""
