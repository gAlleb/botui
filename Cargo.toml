[workspace]
members = ["crates/core", "crates/formats", "crates/store", "crates/app", "crates/bookorbit", "crates/fixed", "crates/opds", "crates/transfer"]
default-members = ["crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[profile.release]
strip = "symbols"
