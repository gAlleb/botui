[workspace]
members = ["crates/core", "crates/formats", "crates/store", "crates/app", "crates/bookorbit", "crates/fixed", "crates/opds", "crates/transfer"]
default-members = ["crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.7"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
opt-level = "s"

# Width changes and opening the contents sidebar reflow the visible EPUB chapter.
[profile.release.package.botui-core]
opt-level = 3

[profile.release.package.blitz-dom]
opt-level = 3

[profile.release.package.stylo]
opt-level = 3

# Scans, cover thumbnails and inline figures share the image resampler.
[profile.release.package.image]
opt-level = 3
