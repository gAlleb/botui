[package]
name = "botui-formats"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.23"
botui-core = { path = "../core" }
encoding_rs = "0.8"
ego-tree = "0.10"
percent-encoding = "2.3"
roxmltree = "0.21"
scraper = { version = "0.24", default-features = false }
zip = { version = "9.4", default-features = false, features = ["deflate"] }
xml = "1"
encoding_rs_io = "0.1"

[dev-dependencies]
serde_json = "1"
