[package]
name = "botui-formats"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[dependencies]
base64 = "0.23"
botui-core = { path = "../core" }
encoding_rs = "0.8"
ego-tree = "0.10"
percent-encoding = "2.3"
roxmltree = "0.21"
scraper = { version = "0.24", default-features = false }
zip = { version = "9.4", default-features = false, features = ["deflate"] }
xml = "1"
encoding_rs_io = "0.1"
xmlparser = "0.13.6"
math-core = "0.9"
imagesize = "0.13"
rars = { version = "0.12.4", default-features = false }

[dev-dependencies]
tempfile = "3"
unicode-width = "0.2"
mimalloc = "0.1.52"
serde_json = "1"
