[package]
name = "botui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
botui-core = { path = "../core" }
botui-formats = { path = "../formats" }
botui-store = { path = "../store" }
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
botui-bookorbit = { path = "../bookorbit" }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ratatui-image = { version = "=12.0.0-rc.3", default-features = false }
lru = "0.18"
botui-fixed = { path = "../fixed" }
botui-opds = { path = "../opds" }
unicode-truncate = "2.0"
