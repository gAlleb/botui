[package]
name = "botui-core"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[dependencies]
unicode-segmentation = "1.13"
unicode-width = "0.2"
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["floats"] }
blitz-html = "=0.3.0-beta.4"
blitz-traits = { version = "=0.3.0-beta.4", default-features = false }
parley = { version = "0.12", default-features = false, features = ["std"] }
style = { package = "stylo", version = "0.22.0" }
rayon = "1.12"
